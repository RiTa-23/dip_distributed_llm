name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # native/ はビルドチェーンが別(Emscripten)のため意図的にフィルタへ含めない = CI対象外
          filters: |
            shared: &shared
              - 'package.json'
              - 'bun.lock'
              - 'packages/shared-types/**'
            web:
              - *shared
              - 'apps/web/**'
            server:
              - *shared
              - 'apps/server/**'

  web:
    name: web (lint/format/test/typecheck)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (oxlint)
        working-directory: apps/web
        run: bun run lint
      - name: Format check (oxfmt)
        working-directory: apps/web
        run: bun run format
      - name: Test (bun test)
        working-directory: apps/web
        run: bun run test
      - name: Typecheck (tsc --noEmit)
        working-directory: apps/web
        run: bun run typecheck

  server:
    name: server (lint/format/test/typecheck)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (oxlint)
        working-directory: apps/server
        run: bun run lint
      - name: Format check (oxfmt)
        working-directory: apps/server
        run: bun run format
      - name: Test (bun test)
        working-directory: apps/server
        run: bun run test
      - name: Typecheck (tsc --noEmit)
        working-directory: apps/server
        run: bun run typecheck
